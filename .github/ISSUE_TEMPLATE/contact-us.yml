name: Contact Us
description: Share feedback, request assistance or get in touch with the team.
title: "[Contact Us] "
labels: ["contact-us"]
body:
  - type: markdown
    attributes:
      value: |
        Use this form to reach out to the DSCE team. Fields marked **required** must be completed before submitting.

  # ── Topic ──────────────────────────────────────────────────
  - type: dropdown
    id: category
    attributes:
      label: Category
      description: Select the topic that best describes your inquiry.
      options:
        - Share feedback
        - Technical assistance
        - Learn more about a use case
        - Get in touch with Sales team
        - Other
    validations:
      required: true

  - type: textarea
    id: discussion
    attributes:
      label: What would you like to discuss?
      description: Provide as much detail as possible (max 500 characters).
      placeholder: Describe your question or feedback…
    validations:
      required: true

  # ── Privacy ────────────────────────────────────────────────
  - type: checkboxes
    id: response
    attributes:
      label: Don't submit personal information or customer/partner IP
      options:
        - label: I understand this GitHub issue and website are public, so I did not include any personal information or anything else that should not be publicly visible..
    validations:
      required: true
