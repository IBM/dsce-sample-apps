name: Deploy Hugo Docs with Filtering

on:
  push:
    branches:
      - main  # Change to master if your default repo branch uses master

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7
        with:
          submodules: true  # Required if your Hugo template utilizes submodules

      - name: Install Hugo Engine
        run: |
          HUGO_VERSION=$(curl -s https://api.github.com/repos/gohugoio/hugo/releases/latest | grep '"tag_name"' | sed 's/.*"v\([^"]*\)".*/\1/')
          curl -sSL "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz" | tar -xz hugo
          sudo mv hugo /usr/local/bin/hugo

      - name: Verify Segment secret is present
        run: |
          if [ -z "${{ secrets.HUGO_SEGMENT_API_KEY }}" ]; then
            echo "::warning::HUGO_SEGMENT_API_KEY secret is not set or is empty"
          else
            echo "HUGO_SEGMENT_API_KEY is set (starts with: ${{ secrets.HUGO_SEGMENT_API_KEY && 'non-empty' }})"
          fi

      - name: Build Hugo Site
        working-directory: ./docs-src  # Runs Hugo inside your target subfolder
        env:
          HUGO_SEGMENT_API_KEY: ${{ secrets.HUGO_SEGMENT_API_KEY }}
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}" 
          # Write a production params overlay so githubRepo is always available.
          mkdir -p config/production
          printf "githubRepoOwner = '%s'\ngithubRepoName = '%s'\n" "${GITHUB_REPOSITORY_OWNER}" "${REPO_NAME}" > config/production/params.toml
          hugo --gc --minify \
            --baseURL "https://${GITHUB_REPOSITORY_OWNER}.github.io/${REPO_NAME}/"

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./docs-src/public  # Grabs compiled HTML assets from subfolder

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v5
