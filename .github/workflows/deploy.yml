name: Deploy Hugo Docs with Filtering

on:
  push:
    branches:
      - main  # Change to master if your default repo branch uses master

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7
        with:
          submodules: true  # Required if your Hugo template utilizes submodules

      - name: Install Hugo Engine
        run: |
          HUGO_VERSION=$(curl -s https://api.github.com/repos/gohugoio/hugo/releases/latest | grep '"tag_name"' | sed 's/.*"v\([^"]*\)".*/\1/')
          curl -sSL "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz" | tar -xz hugo
          sudo mv hugo /usr/local/bin/hugo

      - name: Build Hugo Site
        working-directory: ./docs-src  # Runs Hugo inside your target subfolder
        run: hugo --gc --minify

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./docs-src/public  # Grabs compiled HTML assets from subfolder

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v5
