# Iceberg catalog — watsonx.data / MinIO (OSS) → IBM COS
# =========================================================
# OSS LOCAL MODE (default, Docker Compose):
#   Trino talks to the local tabulario/iceberg-rest container backed by MinIO.
#   No changes required — start with: docker compose up -d
#
# IBM COS MODE:
#   1. Set ICEBERG_REST_URI in .env to your watsonx.data catalog endpoint.
#   2. Replace the s3.* values below with your IBM COS HMAC credentials:
#
#      s3.endpoint=https://s3.<region>.cloud-object-storage.appdomain.cloud
#      s3.aws-access-key=<COS_ACCESS_KEY>
#      s3.aws-secret-key=<COS_SECRET_KEY>
#      s3.region=<COS_REGION>          # e.g. us-south
#      iceberg.rest-catalog.warehouse=s3://<COS_BUCKET>/warehouse
#
#   IBM COS requires path-style access (s3.path-style-access=true).
#   Trino does not support environment-variable substitution in catalog
#   properties — update this file directly and restart the Trino container.
#
# IBM COS endpoint formats:
#   Public:   https://s3.<region>.cloud-object-storage.appdomain.cloud
#   Private:  https://s3.private.<region>.cloud-object-storage.appdomain.cloud
#   Direct:   https://s3.direct.<region>.cloud-object-storage.appdomain.cloud

connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://iceberg-rest:8181
iceberg.rest-catalog.warehouse=s3://watsonx-data-531da588-ba12-4838-8b89-b758d3685189/warehouse
fs.native-s3.enabled=true
s3.endpoint=https://s3.us-south.cloud-object-storage.appdomain.cloud
s3.path-style-access=true
s3.aws-access-key=<COS_ACCESS_KEY>
s3.aws-secret-key=<COS_SECRET_KEY>
s3.region=us-south
