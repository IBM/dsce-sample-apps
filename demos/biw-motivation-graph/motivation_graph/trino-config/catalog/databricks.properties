# Databricks Delta — B4 coexistence catalog
# ============================================
# OSS LOCAL MODE (default): points at the local iceberg-rest container using
# a dedicated "databricks" namespace on MinIO.  No external credentials required.
# Trino loads this catalog cleanly on startup.
#
# REAL DATABRICKS MODE: when DATABRICKS_ICEBERG_REST_URI and DATABRICKS_TOKEN
# are available, replace the values below with those from .env and restart Trino.
# The demo_runner will detect the real endpoint and label the result accordingly.
#
# B4 acceptance: one query joins live (Cassandra) + history (Iceberg) + Databricks
# IN PLACE — data is read at source, never copied.  In OSS mode the "Databricks"
# namespace is a local Iceberg namespace seeded with synthetic Delta-shaped records.

connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://iceberg-rest:8181
iceberg.rest-catalog.warehouse=s3://watsonx-data-531da588-ba12-4838-8b89-b758d3685189/databricks

# S3 configuration — IBM COS (active) / MinIO (OSS fallback)
fs.native-s3.enabled=true
s3.endpoint=https://s3.us-south.cloud-object-storage.appdomain.cloud
s3.path-style-access=true
s3.aws-access-key=<COS_ACCESS_KEY>
s3.aws-secret-key=<COS_SECRET_KEY>
s3.region=us-south
