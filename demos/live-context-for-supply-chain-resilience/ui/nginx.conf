# ui/nginx.conf
# nginx virtual-host config for the Vite/React SPA
# Serves static assets from /usr/share/nginx/html with SPA fallback routing.
#
# BACKEND_URL env var must be set at container startup (Code Engine secret/env var).
# Example: BACKEND_URL=https://oil-gas-backend.abc123.us-south.codeengine.appdomain.cloud

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Compression ───────────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/font-woff2;
    gzip_min_length 1024;

    # ── Backend API proxy ─────────────────────────────────────────────────────
    # All /api/* requests are forwarded to the FastAPI backend service.
    # This replaces the Vite dev proxy for production and avoids any need to
    # bake the backend URL into the static JS bundle.
    # BACKEND_URL is injected at runtime via the nginx.conf.template mechanism
    # (see ui/Dockerfile — envsubst replaces $BACKEND_URL before nginx starts).
    location /api/ {
        proxy_pass        $BACKEND_URL/api/;
        proxy_http_version 1.1;
        proxy_set_header  Host              $host;
        proxy_set_header  X-Real-IP         $remote_addr;
        proxy_set_header  X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header  X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }

    # ── Static assets (Vite content-hashed filenames) ─────────────────────────
    # Assets in /assets/ are fingerprinted – safe to cache for 1 year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── Health-check endpoint (used by Code Engine liveness probe) ────────────
    location /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # ── SPA catch-all ─────────────────────────────────────────────────────────
    # For any path that is not a real file, serve index.html so React Router
    # can handle client-side navigation.
    location / {
        try_files $uri $uri/ /index.html;

        # index.html must never be cached so the browser always fetches the
        # latest shell on deploy.
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }
}
