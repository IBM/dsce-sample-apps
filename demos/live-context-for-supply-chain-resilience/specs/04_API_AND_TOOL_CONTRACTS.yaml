# ══════════════════════════════════════════════════════════════════════════════
# ERROR MODEL
# ══════════════════════════════════════════════════════════════════════════════

error_model:
  description: >
    All errors returned as ApiError with machine-readable code.
    Exception handler at backend/app/core/errors.py maps codes to HTTP status.
  fields:
    code: string          # ApiErrorCode literal
    message: string
    retriable: boolean
    correlation_id: string
    details: object|null

mandatory_error_codes:
  # Generic
  - NOT_FOUND                    # 404
  - INVALID_INPUT                # 400
  - CONFLICT                     # 409
  # Staleness
  - STALE_DATA                   # 409 (profile too old for safe decision)
  # Approval lifecycle
  - APPROVAL_REQUIRED            # 403 (write requires prior APPROVED approval)
  - APPROVAL_MISMATCH            # 409 (option hash changed post-approval)
  # Inventory
  - INSUFFICIENT_INVENTORY       # 422
  # Engineering evidence
  - NO_ENGINEERING_EVIDENCE      # 422 (substitute recommendation requires evidence)
  # Connectivity
  - UPSTREAM_UNAVAILABLE         # 503
  # Supply chain resilience (spec/13)
  - SUPPLIER_CONSTRAINED         # 422 (supplier has HIGH/CRITICAL constraint at execution)
  - AVL_STATUS_CHANGED           # 409 (AVL changed after recommendation was made)
  - RESILIENCE_PROFILE_STALE     # 412 (profile age > 300s threshold)

http_status_mapping:
  NOT_FOUND: 404
  INVALID_INPUT: 400
  STALE_DATA: 409
  CONFLICT: 409
  APPROVAL_REQUIRED: 403
  APPROVAL_MISMATCH: 409
  INSUFFICIENT_INVENTORY: 422
  NO_ENGINEERING_EVIDENCE: 422
  UPSTREAM_UNAVAILABLE: 503
  SUPPLIER_CONSTRAINED: 422
  AVL_STATUS_CHANGED: 409
  RESILIENCE_PROFILE_STALE: 412


# ══════════════════════════════════════════════════════════════════════════════
# STALENESS (spec/13 §6.2)
# ══════════════════════════════════════════════════════════════════════════════

staleness:
  profile_stale_threshold_secs: 300
  description: >
    Resilience profiles considered stale when profile_age_secs > 300.
    The get_resilience_profile endpoint recomputes on-demand when no cache exists.
    UI shows stale warning when stale=true. Configurable via env in production.
  stale_field: stale (boolean in ResilienceProfileResponse)


# ══════════════════════════════════════════════════════════════════════════════
# RESILIENCE ENGINE: compute_resilience_profile (spec/13 §3, spec/09)
# ══════════════════════════════════════════════════════════════════════════════

resilience_engine:
  entrypoint: "backend/app/services/resilience_engine.compute_resilience_profile"
  description: >
    Deterministic correlation engine computing SupplyChainResilienceProfile
    for (workPackageId, materialId). Recomputed on every contributing event
    (spec/13 §3.2) and on-demand for cache misses.

  readiness_status_thresholds:
    CONFIRMED: "resilience_score ≤ 25.0"
    AT_RISK:   "25.0 < resilience_score ≤ 60.0"
    CRITICAL:  "resilience_score > 60.0"

  dimension_scores:
    d1_supplier_coverage:
      weight: 0.30
      description: Unconstrained APPROVED supplier count
      scoring:
        "≥ 3 unconstrained": 0
        "2 unconstrained": 25
        "1 unconstrained": 60
        "0 unconstrained": 100

    d2_inventory_buffer:
      weight: 0.25
      description: Available inventory vs shortfall
      scoring:
        "available_at_destination >= required": 0
        "inventory transfer covers shortfall": 30
        "available > 0 but insufficient": 70
        "no inventory available": 100

    d3_shipment_exposure:
      weight: 0.25
      description: Shipment delay vs required date
      scoring:
        "on-time (days_late ≤ 0)": 0
        "≤ 3 days late": 30
        "≤ 7 days late": 60
        "> 7 days late": 100

    d4_port_disruption:
      weight: 0.20
      description: Port disruption severity for routes used by shipments
      scoring:
        "CLEARED": 0
        "LOW severity": 20
        "MEDIUM severity": 50
        "HIGH or CRITICAL severity": 100

  formula: "resilience_score = D1*0.30 + D2*0.25 + D3*0.25 + D4*0.20"

  blocking_constraint_rules:
    description: >
      A supplier is blocked (unconstrained=false) when:
        - constraint_type in {QUALITY_HOLD, FORCE_MAJEURE, CAPACITY_CONSTRAINT, PORT_CONGESTION}
        - AND constraint_severity in {HIGH, CRITICAL}
      LEAD_TIME_EXTENSION constraints do not block supplier use.
      CLEARED always means unblocked.
    blocking_types:
      - QUALITY_HOLD
      - FORCE_MAJEURE
      - CAPACITY_CONSTRAINT
      - PORT_CONGESTION
    blocking_severities:
      - HIGH
      - CRITICAL


# ══════════════════════════════════════════════════════════════════════════════
# SCORING & OPTION RANKING (spec/09)
# ══════════════════════════════════════════════════════════════════════════════

scoring:
  rank_options:
    description: >
      Filter feasible options, sort by total_score ascending (lower = better).
    algorithm:
      - "feasible = [opt for opt in options if opt.feasible]"
      - "return sorted(feasible, key=lambda o: o.total_score)"

  are_near_equivalent:
    description: >
      Returns true when top two ranked feasible options score within 5 points.
      UI must present both as nearly-tied rather than forcing a single recommendation.
    formula: "abs(a.total_score - b.total_score) < 5.0"

  calculate_total_score:
    description: >
      Weighted composite. Cost normalised to 0–100 scale (max $50,000 USD).
      Lower total_score = better option.
    weights:
      schedule_risk_score: 0.45
      technical_risk_score: 0.25
      supply_risk_score: 0.20
      incremental_cost: 0.10
    cost_normalisation: "min((cost_usd / 50_000) * 100, 100)"
    formula: >
      total = (schedule * 0.45) + (technical * 0.25)
            + (supply * 0.20) + (cost_normalised * 0.10)

  hard_constraints:
    TRANSFER:
      - "source.available >= required_quantity"
      - "source.next_known_requirement_date not jeopardised by transfer"
      error_code: INSUFFICIENT_INVENTORY

    ALTERNATE_SUPPLIER:
      - "supplier.approved == true"
      - "supplier has no blocking constraint"
      error_code: SUPPLIER_CONSTRAINED

    SUBSTITUTE:
      - "engineering evidence present for substitute material"
      error_code: NO_ENGINEERING_EVIDENCE


# ══════════════════════════════════════════════════════════════════════════════
# APPROVAL LIFECYCLE (spec/08)
# ══════════════════════════════════════════════════════════════════════════════

approval_lifecycle:
  state_machine: "PENDING → {APPROVED | REJECTED}"

  states:
    PENDING:    Initial state on creation
    APPROVED:   Human approved; write execution allowed
    REJECTED:   Human rejected
    EXPIRED:    Implied — approval.expiry < datetime.now(UTC)

  create:
    action: "POST /api/actions/approval-requests"
    side_effects:
      - "Captures option_hash = SHA-256(option snapshot excluding option_id and risk_id)"
      - "Sets expiry = now + 24 hours"
      - "Stores in in-memory store keyed by approval_request_id"

  approve:
    action: "POST /api/actions/approval-requests/{id}/approve"
    preconditions:
      - "approval.status == PENDING"
    transition: "PENDING → APPROVED"
    records: [approver, approved_at]

  reject:
    action: "POST /api/actions/approval-requests/{id}/reject"
    transition: "→ REJECTED"
    records: [approver]

  validate_for_execution:
    called_before:
      - execute_inventory_transfer
      - execute_supplier_expedite
      - mark_mitigated
    checks:
      - "approval exists in store"
      - "approval.status == APPROVED"
      - "approval.expiry > datetime.now(UTC)"
      - "SHA-256(current_option) == approval.option_hash"
    errors:
      NOT_FOUND:         "Approval or option not found"
      APPROVAL_REQUIRED: "Approval status is not APPROVED (or expired)"
      APPROVAL_MISMATCH: "Option mutated after approval was granted"

  immutability:
    mechanism: >
      SHA-256 hash captured at approval creation from a snapshot of the option
      (type, feasible, schedule_risk_score, technical_risk_score, supply_risk_score,
      total_score, constraints, evidence_ids). Recomputed before every execution.
    error_if_mismatch: APPROVAL_MISMATCH
