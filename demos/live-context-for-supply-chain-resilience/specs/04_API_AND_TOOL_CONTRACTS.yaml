openapi_target: "3.1"
version: "1.1"

principles:
  - read_tools_are_separate_from_write_tools
  - write_tools_require_approval_context
  - all_requests_accept_correlation_id
  - all_responses_return_source_timestamp
  - errors_use_machine_readable_codes
  - supply_chain_resilience_context_accompanies_supplier_results

# ══════════════════════════════════════════════════════════════════════════════
# READ TOOLS
# ══════════════════════════════════════════════════════════════════════════════

read_tools:

  # ── Risk investigation ────────────────────────────────────────────────────

  list_risks:
    endpoint: "GET /api/risks"
    input: {}
    output:
      risks: list[RiskEvent]
      total: integer
      source_timestamp: datetime

  get_risk:
    endpoint: "GET /api/risks/{risk_id}"
    input:
      risk_id: string
    output:
      risk: RiskEvent
      source_timestamp: datetime

  evaluate_mitigation_options:
    endpoint: "GET /api/risks/{risk_id}/options"
    description: >
      Returns ranked mitigation options for a risk. Feasible options sorted
      by total_score ascending (lower = better per spec/09). near_equivalent_top_two
      is true when top two feasible options differ by < 5 score points.
    input:
      risk_id: string
    output:
      risk_id: string
      ranked_options: list[MitigationOption]
      near_equivalent_top_two: boolean
      score_version: string     # "v1"
      source_timestamp: datetime

  # ── Shipments, work packages, inventory, suppliers ────────────────────────

  get_shipment:
    endpoint: "GET /api/shipments/{shipment_id}"
    input:
      shipment_id: string
    output:
      shipment: Shipment
      source_timestamp: datetime

  get_work_package:
    endpoint: "GET /api/work-packages/{work_package_id}"
    input:
      work_package_id: string
    output:
      work_package: WorkPackage
      requirements: list[MaterialRequirement]
      source_timestamp: datetime

  get_inventory_options:
    endpoint: "GET /api/inventory/options"
    input_params:
      material_id: string
      destination_location_id: string
      quantity: number
      required_by: datetime
    output:
      material_id: string
      destination_location_id: string
      candidates: array            # {position: InventoryPosition, transfer_feasible: bool, notes: list[string]}
      evaluated_at: datetime

  get_supplier_options:
    endpoint: "GET /api/suppliers/options"
    input_params:
      material_id: string
      required_by: datetime
      quantity: number
    output:
      material_id: string
      candidates: array            # only APPROVED, non-constrained suppliers
      excludedDueToConstraint: array
      evaluated_at: datetime

  # ── Knowledge retrieval (RAG) ─────────────────────────────────────────────

  retrieve_enterprise_knowledge:
    endpoint: "POST /api/knowledge/retrieve"
    description: >
      Hybrid BM25 + semantic RAG retrieval. Substitution claims require at least
      one current approved engineering/substitution source — grounded=false otherwise.
    input:
      query: string
      filters: object
      top_k: integer                # default 5
    output:
      answer: string
      grounded: boolean
      confidence: number            # 0..1
      evidence: list[Evidence]
      applied_filters: object
      query_id: string

  # ── Supply chain resilience ───────────────────────────────────────────────

  get_resilience_profile:
    endpoint: "GET /api/resilience/profile"
    description: >
      Returns full SupplyChainResilienceProfile for (work_package_id, material_id).
      Serves from cache; recomputes on-demand if no cached profile exists.
      Stale threshold: 300 seconds (spec/13 §6.2). Returns stale=true if exceeded.
    input_params:
      work_package_id: string
      material_id: string
    output:
      profile: SupplyChainResilienceProfile
        work_package_id: string
        material_id: string
        requirement_id: string
        assessed_at: datetime
        readiness_status: string     # CONFIRMED | AT_RISK | CRITICAL | UNKNOWN
        days_to_required: integer
        available_at_destination: number
        shortfall: number
        unconstrained_approved_supplier_count: integer
        feasible_transfer_location_count: integer
        feasible_alternate_supplier_count: integer
        resilience_score: number     # 0..100, lower = better (spec/09)
        primary_supplier_status: string
        secondary_supplier_status: string|null
        last_contributing_event_id: string
        supplier_coverage_score: number   # D1 dimension, weight 0.30
        inventory_buffer_score: number    # D2 dimension, weight 0.25
        shipment_exposure_score: number   # D3 dimension, weight 0.25
        port_disruption_score: number     # D4 dimension, weight 0.20
      evaluated_at: datetime
      profile_age_secs: integer      # staleness indicator for the UI
      stale: boolean                 # true if age > 300 seconds

  get_avl_status:
    endpoint: "GET /api/resilience/avl"
    description: >
      Returns AVL entries for a material with live constraint context.
      Sorted: unconstrained APPROVED first, then by tier (PRIMARY < SECONDARY < TERTIARY < SPOT).
    input_params:
      material_id: string
    output:
      material_id: string
      entries: list[AvlEntryResponse]
        # per entry:
        supplier_id: string
        supplier_name: string
        tier: string                 # PRIMARY | SECONDARY | TERTIARY | SPOT
        avl_status: string           # APPROVED | SUSPENDED | REVOKED
        constrained: boolean
        constraint_type: string|null
        constraint_severity: string|null
        constraint_source_event_id: string|null
      unconstrained_approved_count: integer
      evaluated_at: datetime

  get_port_status:
    endpoint: "GET /api/resilience/port-status"
    description: >
      Returns port disruption status and optionally counts impacted shipments
      for a material routing through that port.
    input_params:
      port_code: string
      material_id: string|null       # optional; filters impacted shipment count
    output:
      port_code: string
      port_name: string
      disruption_type: string|null
      severity: string|null
      estimated_clear_date: datetime|null
      impacted_shipment_count: integer
      evaluated_at: datetime

  get_supplier_resilience_status:
    endpoint: "GET /api/resilience/supplier-status"
    description: >
      Returns live constraint state (ACTIVE | CLEARED) for a specific supplier.
      Used by ProcurementAgent and ResilienceMonitorAgent.
    input_params:
      supplier_id: string
      material_id: string|null       # null = query across all materials
    output:
      supplier_id: string
      supplier_name: string
      material_id: string|null
      status: string                 # ACTIVE | CLEARED
      constraint_type: string|null
      constraint_severity: string|null
      affected_from_date: datetime|null
      estimated_resolution_date: datetime|null
      source_event_id: string|null
      evaluated_at: datetime


# ══════════════════════════════════════════════════════════════════════════════
# WRITE TOOLS  (all require prior APPROVED approval)
# ══════════════════════════════════════════════════════════════════════════════

write_tools:

  # ── Approval lifecycle ────────────────────────────────────────────────────

  request_mitigation_approval:
    endpoint: "POST /api/actions/approval-requests"
    description: >
      Creates PENDING approval request. Captures option_hash (SHA-256 snapshot)
      for post-approval immutability verification. 24-hour expiry.
    input:
      risk_id: string
      option_id: string
      recommendation_summary: string
    output:
      approval_request_id: string
      risk_id: string
      option_id: string
      option_hash: string
      recommendation_summary: string
      approver: string|null
      approved_at: datetime|null
      expiry: datetime
      status: string                 # PENDING
      created_at: datetime

  approve_mitigation:
    endpoint: "POST /api/actions/approval-requests/{approval_request_id}/approve"
    description: Transitions PENDING → APPROVED; records approver name and timestamp.
    input:
      approval_request_id: string
      approver: string
    output: ApprovalRequest

  reject_mitigation:
    endpoint: "POST /api/actions/approval-requests/{approval_request_id}/reject"
    description: Transitions to REJECTED; records approver name.
    input:
      approval_request_id: string
      approver: string
    output: ApprovalRequest

  # ── Execution write tools ─────────────────────────────────────────────────

  execute_inventory_transfer:
    endpoint: "POST /api/actions/inventory-transfer"
    preconditions:
      - approvalRequest.status == "APPROVED"
      - approvalRequest not expired (expiry > now)
      - option_hash unchanged since approval
      - source.available >= transfer.quantity
    input:
      approval_request_id: string
      risk_id: string
      option_id: string
      source_location_id: string
      destination_location_id: string
      material_id: string
      quantity: number
    output:
      transfer_request_id: string
      status: string                 # CREATED | REJECTED
      source_timestamp: datetime
    error_codes:
      - APPROVAL_REQUIRED
      - APPROVAL_MISMATCH
      - INSUFFICIENT_INVENTORY
      - NOT_FOUND

  execute_supplier_expedite:
    endpoint: "POST /api/actions/supplier-expedite"
    preconditions:
      - approvalRequest.status == "APPROVED"
      - approvalRequest not expired
      - supplier has no active HIGH/CRITICAL constraint at execution time
    input:
      approval_request_id: string
      risk_id: string
      shipment_id: string
      requested_eta: datetime
    output:
      expedite_request_id: string
      status: string                 # CREATED | REJECTED
      source_timestamp: datetime
    error_codes:
      - APPROVAL_REQUIRED
      - SUPPLIER_CONSTRAINED
      - NOT_FOUND

  mark_mitigated:
    endpoint: "POST /api/actions/mark-mitigated"
    description: >
      Mark risk MITIGATED for option types without a dedicated execute endpoint
      (WAIT, ALTERNATE_SUPPLIER, SUBSTITUTE).
    preconditions:
      - approvalRequest.status == "APPROVED"
      - approvalRequest not expired
    input:
      approval_request_id: string
      risk_id: string
      option_id: string
    output:
      risk_id: string
      status: string
    error_codes:
      - APPROVAL_REQUIRED
      - NOT_FOUND

  # ── Resilience ingest (called by demo loop / Kafka consumers) ─────────────

  upsert_supplier_constraint:
    endpoint: "POST /api/resilience/supplier-constraint"
    description: >
      Ingest supplier constraint from Kafka consumer or demo loop.
      Triggers resilience profile recomputation for all (workPackage, material) pairs
      that reference the affected material.
    input:
      supplier_id: string
      material_id: string|null
      constraint_type: string        # ConstraintType literal
      constraint_severity: string    # ConstraintSeverity literal
      affected_from_date: string|null
      estimated_resolution_date: string|null
      source_reference: string|null
      notes: string|null
      event_id: string|null
      correlation_id: string|null
    output:
      updated: boolean
      supplier_id: string
      constraint_type: string
      constraint_severity: string

  upsert_port_disruption:
    endpoint: "POST /api/resilience/port-disruption"
    description: >
      Ingest port disruption from Kafka consumer or demo loop.
      Updates port status in store.
    input:
      port_code: string
      port_name: string|null
      disruption_type: string        # PortDisruptionType literal
      severity: string               # ConstraintSeverity literal
      affected_from_date: string|null
      estimated_clear_date: string|null
      impacted_shipment_ids: list[string]
      affected_logistics_providers: list[string]
      event_id: string|null
      correlation_id: string|null
    output:
      updated: boolean
      port_code: string
      disruption_type: string
      severity: string


# ══════════════════════════════════════════════════════════════════════════════
# DEMO TOOLS  (SYNTHETIC DEMO ONLY — never in production)
# ══════════════════════════════════════════════════════════════════════════════

demo_tools:
  DEMO_WARNING: "SYNTHETIC DATA ONLY — not real Shell or Pearl GTL operational data"

  demo_reset:
    endpoint: "POST /api/demo/reset"
    description: Reset in-memory store to seed state; clear idempotency keys and audit trail.
    input: {}
    output:
      message: string
      demo_warning: string

  simulate_delay:
    endpoint: "POST /api/demo/simulate-delay"
    description: >
      Simulate a shipment delay and trigger LATE_DELIVERY risk detection
      per spec/03 event contract.
    input:
      shipment_id: string
      requirement_id: string
      correlation_id: string|null
    output:
      risk_detected: boolean
      risk_id: string|null
      severity: string|null
      correlation_id: string

  get_audit_trail:
    endpoint: "GET /api/demo/audit"
    input_params:
      correlation_id: string|null    # optional filter
    output:
      trail: list[object]

  # ── Confluent trace bridge ────────────────────────────────────────────────
  # Used by TraceBridgeReader when CONFLUENT_READ_MODE=trace or direct read unavailable.

  get_confluent_trace:
    endpoint: "GET /api/confluent/trace"
    description: >
      Returns synthetic Kafka events for a correlationId across all (or filtered)
      TSCI topics. Events sorted: timestamp asc, offset asc within topic.
      Called by TraceBridgeReader.trace_by_correlation().
    input_params:
      correlation_id: string         # required; exact match
      lookback_minutes: integer      # 1..120, default 60 (not enforced in demo)
      topics: string|null            # comma-separated topic filter; null = all topics
      max_records_per_topic: integer # 1..100, default 50
    output:
      correlation_id: string
      source: string                 # "TRACE_BRIDGE"
      events: list[NormalizedEvent]
      event_count: integer
      demo_warning: string
    normalized_event_fields:
      topic: string
      partition: integer
      offset: integer
      timestamp: string              # ISO-8601
      key: string
      correlationId: string
      eventId: string
      eventType: string
      value: object

  get_confluent_records:
    endpoint: "GET /api/confluent/records"
    description: >
      Returns synthetic records for one topic, optionally filtered by correlation_id.
      Called by TraceBridgeReader.recent_records().
    input_params:
      topic: string                  # required; exact topic name
      correlation_id: string|null    # optional filter
      lookback_minutes: integer      # 1..120, default 30 (not enforced in demo)
      max_records: integer           # 1..100, default 50
    output:
      topic: string
      correlation_id: string|null
      source: string                 # "TRACE_BRIDGE"
      records: list[NormalizedEvent]
      count: integer
      demo_warning: string

  confluent_trace_bridge_event_log:
    description: >
      Synthetic 9-event log seeded at API startup. Fixed baseline timestamp
      2026-09-25T08:00:00Z; offsets 0s–2100s. Always returns same events
      for any matching correlationId. DEMO ONLY.
    correlation_id: "DEMO-TW2047-001"
    events:
      - topic: turnaround.material.required
        offset_secs: 0
        event_id: EVT-MR-A1B2C3D4
        description: Material requirement raised — CVA-8842 for TW-2047
      - topic: supply.inventory.changed
        offset_secs: 300
        event_id: EVT-INV-E5F6G7H8
        description: Inventory consumed — PEARL-DEMO on-hand 1→0
      - topic: supply.supplier.status.changed
        offset_secs: 600
        event_id: EVT-SC-0001
        description: SUP-101 QUALITY_HOLD CRITICAL activated
      - topic: supply.supplier.status.changed
        offset_secs: 660
        event_id: EVT-SC-0002
        description: SUP-203 PORT_CONGESTION HIGH activated (SGSIN)
      - topic: supply.port.status.changed
        offset_secs: 720
