server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Reverse proxy all /api/* requests to the FastAPI backend service.
    # On OpenShift the backend is reachable via its Kubernetes Service name.
    # The BACKEND_HOST env var is injected at container start by the entrypoint;
    # it defaults to "incident-backend:8765" (the OC service) but stays as
    # "backend:8765" for local docker-compose runs.
    location /api/ {
        proxy_pass         http://incident-backend:8765/api/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # React SPA fallback — serve index.html for all non-asset routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}
