spec_version: v1
kind: control
control:
  # ── Artifact binding ────────────────────────────────────────────────────────
  artifact_name: SecretsDetection    # exact internal name from `orchestrate controls list-types`
  name: incident_secrets_detection   # unique name for this control instance
  display_name: Incident Secrets Detector
  description: >
    Redacts API keys, JWT tokens, private keys, and other credentials that may
    appear in incident logs or configuration snippets. Prevents accidental
    exposure of secrets in agent responses during analysis.

  # ── Execution hooks ─────────────────────────────────────────────────────────
  # agent_pre_invoke  → scrub secrets from incoming incident data / user prompts
  # agent_post_invoke → scrub secrets from agent responses before delivery
  hooks:
    - agent_pre_invoke
    - agent_post_invoke

  # Priority 30 → fires after PII filter (10) and guardrails (20)
  priority: 30

  # ── Agent binding ────────────────────────────────────────────────────────────
  agent_names:
    - incident_resolution_agent

  # ── Control configuration ────────────────────────────────────────────────────
  # All detection flags default to false — must opt in explicitly.
  # See: orchestrate controls get-type --name SecretsDetection
  config:
    enabled:
      jwt_like:             true   # JWT tokens in auth logs / config snippets
      private_key_block:    true   # PEM private keys accidentally pasted in logs
      aws_access_key_id:    true   # AWS keys in env dumps / stack traces
      aws_secret_access_key: true  # AWS secret keys
      google_api_key:       true   # GCP API keys in config files
      slack_token:          true   # Slack webhook/bot tokens in config
      hex_secret_32:        true   # Generic 32-char hex secrets (API keys, etc.)
      base64_24:            false  # Too many false positives on base64 log output

    # Replace detected secrets with redaction text (vs just flagging them)
    redact: true
    redaction_text: "***REDACTED***"

    # Don't block outright — redact and continue so analysis still completes
    block_on_detection: false
    min_findings_to_block: 1
