[project]
name = "bob-in-slack-salesforce-sample"
version = "0.3.0"
description = "Sample integration of IBM Bob into Slack over the Agent Client Protocol: a governed case-resolution flow for a Salesforce org"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["fastapi>=0.115.5", "uvicorn>=0.32.0", "httpx>=0.27", "PyJWT>=2.14.0", "cryptography>=50.0.0"]

[project.optional-dependencies]
dev = ["pytest>=9.0.3"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
headless_bob = ["assets/*.png", "assets/*.svg"]
