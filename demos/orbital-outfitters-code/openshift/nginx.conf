server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    absolute_redirect off;

    # Proxy /api/* to the backend service, stripping the /api prefix
    location /api/ {
        proxy_pass http://backend:3001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed static assets — cache for 1 year (Vite fingerprints filenames on every build)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html — never cache; browser always re-fetches so new JS bundles are picked up immediately
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Serve the React SPA for all other paths
    location / {
        try_files $uri $uri/ /index.html;
    }
}
