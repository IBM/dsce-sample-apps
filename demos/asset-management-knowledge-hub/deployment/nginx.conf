# =============================================================================
# nginx.conf — Maximo Knowledge Hub Frontend
# Serves the Vite SPA static bundle and reverse-proxies backend routes.
#
# Proxy targets are read from environment variables at container startup via
# envsubst (see the CMD in Dockerfile or the entrypoint script).
# Override with: -e BACKEND_API_URL=https://... -e INGEST_API_URL=https://...
#
# Paths are tuned for registry.access.redhat.com/ubi9/nginx-122:
#   static root → /opt/app-root/src
#   pid file    → /run/nginx.pid
# =============================================================================

worker_processes  auto;
# Send error log to stderr so IBM Code Engine captures it in the app logs.
error_log  /dev/stderr warn;
pid        /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';

    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;
    gzip            on;
    gzip_types      text/plain text/css application/json application/javascript
                    text/xml application/xml application/xml+rss text/javascript
                    font/woff2;

    # ── Resolver — defer upstream DNS to request time (not startup) ───────────
    # This prevents nginx failing with "host not found" when a backend URL
    # is a dummy/not-yet-deployed service. IBM Code Engine uses standard DNS.
    # TTL of 30s keeps the address fresh as Code Engine may re-route deployments.
    resolver 1.1.1.1 8.8.8.8 valid=30s ipv6=off;
    resolver_timeout 5s;

    server {
        listen       8080;
        server_name  _;

        root  /opt/app-root/src;
        index index.html;

        # ── Security headers ──────────────────────────────────────────────────
        add_header X-Content-Type-Options "nosniff"          always;
        add_header X-Frame-Options        "SAMEORIGIN"       always;
        add_header X-XSS-Protection       "1; mode=block"    always;
        add_header Referrer-Policy        "strict-origin"    always;

        # ── Static assets — long cache ─────────────────────────────────────────
        location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp|map)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # ── MCP / Knowledge Hub API  (/api/*) ─────────────────────────────────
        # No rewrite — proxy_pass $backend (origin-only variable, no path) causes
        # nginx to append the original $uri automatically, AND populates $proxy_host
        # with the upstream hostname.  Both behaviours are correct here.
        location /api/ {
            set $backend "${BACKEND_API_URL}";
            proxy_pass            $backend;
            proxy_http_version    1.1;
            proxy_ssl_server_name on;
            proxy_ssl_verify      off;
            proxy_set_header      Host              $proxy_host;
            proxy_set_header      X-Real-IP         $remote_addr;
            proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header      X-Forwarded-Proto $scheme;
            proxy_read_timeout    120s;
            proxy_send_timeout    120s;
        }

        # ── Health endpoint  (/health) ────────────────────────────────────────
        location /health {
            set $backend "${BACKEND_API_URL}";
            proxy_pass            $backend;
            proxy_http_version    1.1;
            proxy_ssl_server_name on;
            proxy_ssl_verify      off;
            proxy_set_header      Host              $proxy_host;
            proxy_set_header      X-Real-IP         $remote_addr;
            proxy_read_timeout    10s;
        }

        # ── Ingestion pipeline  (/ingest-api/*) ───────────────────────────────
        # Strip the /ingest-api prefix by capturing the remainder into $ingest_path,
        # then concatenate with the upstream variable: proxy_pass $ingest$ingest_path.
        # This avoids rewrite+break which (with a variable proxy_pass) causes nginx
        # to silently drop the response body due to connection-close mis-handling.
        # The explicit Host header is required because $proxy_host is empty for
        # concatenated-variable proxy_pass targets on Code Engine's ingress.
        location ~ ^/ingest-api(/.*)?$ {
            set $ingest      "${INGEST_API_URL}";
            set $ingest_host "${INGEST_HOST}";
            set $ingest_path $1;
            # Preserve query string (nginx bare-variable syntax, no ${} braces)
            if ($is_args) {
                set $ingest_path $ingest_path$is_args$args;
            }
            proxy_pass            $ingest$ingest_path;
            proxy_http_version    1.1;
            proxy_ssl_server_name on;
            proxy_ssl_verify      off;
            proxy_set_header      Host              $ingest_host;
            proxy_set_header      X-Real-IP         $remote_addr;
            proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header      X-Forwarded-Proto $scheme;
            proxy_read_timeout    300s;
            proxy_send_timeout    300s;
            client_max_body_size  50m;
        }

        # ── OpenSearch proxy  (/opensearch-api/*) ────────────────────────────
        location ~ ^/opensearch-api(/.*)?$ {
            set $opensearch "${OPENSEARCH_URL}";
            set $os_host    "${OPENSEARCH_HOST}";
            set $os_path    $1;
            proxy_pass            $opensearch$os_path;
            proxy_http_version    1.1;
            proxy_ssl_server_name on;
            proxy_ssl_verify      off;
            proxy_set_header      Host              $os_host;
            proxy_set_header      X-Real-IP         $remote_addr;
            proxy_read_timeout    30s;
        }

        # ── SPA fallback — all unmatched routes serve index.html ─────────────
        location / {
            try_files $uri $uri/ /index.html;
        }

        # ── Internal liveness probe ───────────────────────────────────────────
        location = /nginx-health {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }
    }
}
