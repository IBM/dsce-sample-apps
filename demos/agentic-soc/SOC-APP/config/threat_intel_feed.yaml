# SOC — Threat Intelligence Feed
# Used by: soc_lookup_threat_intel (Triage adjustment TG; Classification N1)
#
# Fields:
#   ip       : IP address to look up
#   verdict  : clean | suspicious | malicious | unknown  ← DUMMY for external IPs
#   is_known_scanner    : true if this is a registered internal scanner  ← NEEDS_REVIEW
#   is_known_partner_cdn: true if this is a partner or CDN IP (no-block flag) ← NEEDS_REVIEW
#   sources  : list of TI sources that contributed the verdict
#
# DUMMY entries are placeholders — replace with real TI verdicts from the TI platform.
# Internal RFC1918 IPs are marked clean by definition (not external threat actors).
# External IPs from confirmed True Positive offenses are marked suspicious as a safe default.
# All verdicts marked "# DUMMY" must be overwritten with real TI data from customer.
#
# Evidence sources: 25-offense PoC validation set.

