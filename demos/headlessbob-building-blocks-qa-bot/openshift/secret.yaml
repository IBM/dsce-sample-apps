# ── Shared credentials secret ─────────────────────────────────────────────────
# Create this BEFORE applying any other manifests.
#
# Usage:
#   BOB_API_KEY=<your-key> ./deploy.sh
#
# Or manually:
#   oc create secret generic bb-qa-credentials \
#     --from-literal=BOB_API_KEY=<your-key> \
#     --from-literal=AUTH_TOKENS='{"app":"<your-key>"}' \
#     --dry-run=client -o yaml | oc apply -f -
#
# This file is a template — do NOT commit with real values.
apiVersion: v1
kind: Secret
metadata:
  name: bb-qa-credentials
  labels:
    app.kubernetes.io/part-of: bb-qa-bot
type: Opaque
stringData:
  # Your Headless Bob API key
  BOB_API_KEY: "REPLACE_ME"
  # JSON map of caller → token (must match BOB_API_KEY value)
  AUTH_TOKENS: '{"app":"REPLACE_ME"}'
