# ── Headless Bob — ImageStream + BuildConfig ──────────────────────────────────
# Builds the headless-bob image from local source using binary build strategy.
#
# Trigger a build:
#   oc start-build headless-bob --from-dir=headless-bob/assets/headlessbob --follow
#
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: headless-bob
  labels:
    app: headless-bob
    app.kubernetes.io/part-of: bb-qa-bot
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: headless-bob
  labels:
    app: headless-bob
    app.kubernetes.io/part-of: bb-qa-bot
spec:
  runPolicy: Serial
  source:
    type: Binary
    binary: {}
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Dockerfile
  output:
    to:
      kind: ImageStreamTag
      name: "headless-bob:latest"
  resources:
    requests: { cpu: 500m, memory: 1Gi }
    limits:   { cpu: "2",  memory: 3Gi }
  successfulBuildsHistoryLimit: 2
  failedBuildsHistoryLimit: 2
