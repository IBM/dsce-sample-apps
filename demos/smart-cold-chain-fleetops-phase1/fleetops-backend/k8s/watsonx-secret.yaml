apiVersion: v1
kind: Secret
metadata:
  name: watsonx-orchestrate-credentials
  namespace: fleetops-backend
  labels:
    app: fleetops
    component: backend
type: Opaque
stringData:
  # WatsonX Orchestrate URL
  WATSONX_ORCHESTRATE_URL: "YOUR_WATSONX_ORCHESTRATE_URL"
  
  # WatsonX Orchestrate API Key
  WATSONX_ORCHESTRATE_API_KEY: "YOUR_API_KEY"
  
  # Agent IDs
  WATSONX_ORCHESTRATE_AGENT_WEATHER: "YOUR_WEATHER_AGENT_ID"
  WATSONX_ORCHESTRATE_AGENT_STATION: "YOUR_STATION_AGENT_ID"
  WATSONX_ORCHESTRATE_AGENT_ROUTE: "YOUR_ROUTE_AGENT_ID"
  WATSONX_ORCHESTRATE_AGENT_DECISION: "YOUR_DECISION_AGENT_ID"
  WATSONX_ORCHESTRATE_AGENT_NOTIFICATION: "YOUR_NOTIFICATION_AGENT_ID"

# INSTRUCTIONS:
# 1. Replace all "YOUR_*" placeholders with your actual WatsonX Orchestrate credentials
# 2. Apply this secret BEFORE deploying the application:
#    oc apply -f fleetops-backend/k8s/watsonx-secret.yaml
# 3. The deployment will automatically reference these environment variables

