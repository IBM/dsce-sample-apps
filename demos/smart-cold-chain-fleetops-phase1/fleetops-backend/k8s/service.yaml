apiVersion: v1
kind: Service
metadata:
  name: fleetops-backend
  namespace: fleetops-backend
  labels:
    app: fleetops
    component: backend
  annotations:
    description: "FleetOps Backend Service"
spec:
  type: ClusterIP
  ports:
  - port: 8085
    targetPort: 8085
    protocol: TCP
    name: http
  selector:
    app: fleetops
    component: backend
  sessionAffinity: None

