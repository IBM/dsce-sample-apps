apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: fleetops-data
  namespace: fleetops-backend
  labels:
    app: fleetops
    component: backend
spec:
  accessModes:
    - ReadWriteOnce  # RWO for block storage
  resources:
    requests:
      storage: 10Gi  # Increased storage for simulation data
  storageClassName: ocs-storagecluster-ceph-rbd  # Default storage class for your cluster

