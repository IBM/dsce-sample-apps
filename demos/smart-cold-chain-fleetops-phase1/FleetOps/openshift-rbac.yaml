---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fleetops-sa
  labels:
    app: fleetops
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: fleetops-role
  labels:
    app: fleetops
rules:
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list", "patch", "update"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fleetops-rolebinding
  labels:
    app: fleetops
subjects:
- kind: ServiceAccount
  name: fleetops-sa
roleRef:
  kind: Role
  name: fleetops-role
  apiGroup: rbac.authorization.k8s.io

