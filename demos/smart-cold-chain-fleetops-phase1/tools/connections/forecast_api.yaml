# FleetOps Forecasting / Notification API Connection
#
# This key-value connection injects the FleetOps forecasting backend URL into:
#   - whatsapp_notification/whatsapp_notification_tool.py  (key: FORECAST_API_URL)
#
# Import this file:
#   orchestrate connections import -f tools/connections/forecast_api.yaml
#
# Then set credentials for each environment:
#   orchestrate connections set-credentials -a forecast_api --env draft \
#     -e "FORECAST_API_URL=https://<your-host>"
#   orchestrate connections set-credentials -a forecast_api --env live \
#     -e "FORECAST_API_URL=https://<your-host>"
#
# Local emulation (no orchestrate server needed):
#   export WXO_SECURITY_SCHEMA_forecast_api=key_value_creds
#   export WXO_CONNECTION_forecast_api_FORECAST_API_URL=https://<your-host>

spec_version: v1
kind: connection
app_id: forecast_api
environments:
    draft:
        kind: key_value
        type: team
    live:
        kind: key_value
        type: team
